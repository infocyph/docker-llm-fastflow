name: Check

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Static, Compose and image contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shell validation
        run: |
          bash -n scripts/llm-fastflow scripts/lib/*.sh scripts/commands/*.sh scripts/ci/*.sh tests/*.sh
          shellcheck -x scripts/llm-fastflow scripts/lib/*.sh scripts/commands/*.sh scripts/ci/*.sh tests/*.sh

      - name: Contract tests
        run: bash tests/contracts.sh

      - name: Verify current upstream default model exists
        run: |
          curl -fsSL https://raw.githubusercontent.com/ROCm/FastFlowLM/main/src/model_list.json \
            | jq -e '.models["qwen3.5"]["9b"]' >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Dockerfile structure
        run: docker buildx build --check --progress=plain .

      - name: Build current runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          pull: true
          tags: llm-fastflow:check
          build-args: |
            LLM_FASTFLOW_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=fastflow-check
          cache-to: type=gha,mode=max,scope=fastflow-check

      - name: Runtime image smoke
        env:
          FASTFLOWLM_VERSION: "1.0.6"
          LLM_FASTFLOW_VERSION: ci-${{ github.sha }}
        run: bash scripts/ci/image-smoke.sh llm-fastflow:check
